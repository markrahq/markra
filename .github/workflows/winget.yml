name: WinGet

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      submit:
        default: true
        type: boolean
    secrets:
      WINGET_CREATE_GITHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag_name:
        description: Published stable release tag, for example v2.13.0
        required: true
        type: string
      submit:
        description: Submit a pull request to microsoft/winget-pkgs
        default: false
        type: boolean
  pull_request:
    paths:
      - .github/workflows/winget.yml
      - .github/workflows/release.yml
      - scripts/release/generate-winget-manifests*
      - packaging/winget/**

permissions:
  contents: read

concurrency:
  group: winget-${{ inputs.tag_name || github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  winget:
    name: Windows x64 manifest and installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Verify WinGet submission token
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            Write-Output '::warning::WINGET_CREATE_GITHUB_TOKEN is missing; token verification is skipped.'
            exit 0
          }
          $headers = @{ Authorization = "Bearer $env:WINGET_CREATE_GITHUB_TOKEN"; Accept = 'application/vnd.github+json' }
          $response = Invoke-WebRequest -Uri 'https://api.github.com/user' -Headers $headers
          $scopes = ($response.Headers['X-OAuth-Scopes'] -join ',').Split(',').Trim()
          # Classic PATs advertise their scopes; fine-grained tokens cannot be used by WinGetCreate.
          if ('public_repo' -notin $scopes -and 'repo' -notin $scopes) {
            throw 'WinGetCreate requires a classic personal access token with public_repo access.'
          }
          Write-Output 'WinGet token authentication succeeded and public repository access is available.'

      - name: Checkout release tooling
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the published x64 NSIS installer
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if (-not $tag) {
            # PR validation uses the checked-in bootstrap release, never an unpublished package version.
            $baseline = Get-ChildItem packaging/winget -Filter Markra.Markra.yaml -Recurse
            if (@($baseline).Count -ne 1) { throw 'Expected one bootstrap version manifest.' }
            $version = [regex]::Match((Get-Content $baseline.FullName -Raw), '(?m)^PackageVersion: "([^"]+)"$').Groups[1].Value
            $tag = "v$version"
          }
          if ($tag -cnotmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'WinGet only accepts stable vX.Y.Z release tags.'
          }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the GitHub release.' }
          if ($release.draft -or $release.prerelease) { throw 'WinGet requires a published stable release.' }

          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $encodedConfig = gh api "repos/$env:GITHUB_REPOSITORY/contents/apps/desktop/src-tauri/tauri.conf.json?ref=$tag" --jq .content
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the released Tauri configuration.' }
          $configJson = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($encodedConfig -join '')))
          $configJson | Set-Content release-assets/tauri.conf.json -Encoding utf8
          $config = $configJson | ConvertFrom-Json
          $version = $tag.Substring(1)
          if ($config.version -ne $version) { throw 'Release and Tauri versions do not match.' }
          $assetName = "$($config.productName)_${version}_windows_x64_setup.exe"
          $assets = @($release.assets | Where-Object { $_.name -ceq $assetName })
          if ($assets.Count -ne 1) { throw "Expected exactly one $assetName release asset." }
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $assetName --dir release-assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the NSIS installer.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "url=$($assets[0].browser_download_url)" >> $env:GITHUB_OUTPUT
          "installer=release-assets/$assetName" >> $env:GITHUB_OUTPUT
          "manifest_dir=generated/winget/manifests/m/Markra/Markra/$version" >> $env:GITHUB_OUTPUT

      - name: Generate WinGet manifests
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_ASSETS_ROOT: release-assets
          TAURI_CONFIG_PATH: release-assets/tauri.conf.json
        run: node scripts/release/generate-winget-manifests.mjs

      - name: Verify bootstrap manifests are reproducible
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          git diff --no-index -- packaging/winget generated/winget
          if ($LASTEXITCODE -ne 0) { throw 'Regenerate the checked-in bootstrap manifests.' }

      - name: Validate manifests with WinGet
        shell: pwsh
        env:
          MANIFEST_DIR: ${{ steps.release.outputs.manifest_dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-Module -Name Microsoft.WinGet.Client -Scope CurrentUser -Force -Repository PSGallery
            Repair-WinGetPackageManager -Force -Latest
          }
          winget validate --manifest $env:MANIFEST_DIR --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest validation failed.' }

      - name: Verify silent install and uninstall
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.release.outputs.installer }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content release-assets/tauri.conf.json -Raw | ConvertFrom-Json
          $publisher = $config.bundle.publisher
          if (-not $publisher) { $publisher = $config.identifier.Split('.')[1] }
          $installed = Start-Process -FilePath $env:INSTALLER_PATH -ArgumentList '/S' -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Silent installation failed: $($installed.ExitCode)" }
          $registryPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$($config.productName)"
          $entry = Get-ItemProperty $registryPath
          $installDir = $entry.InstallLocation.Trim('"')
          try {
            if ($entry.DisplayName -cne $config.productName -or $entry.Publisher -cne $publisher -or $entry.DisplayVersion -cne $env:RELEASE_VERSION) {
              throw 'Installed application metadata does not match the manifest.'
            }
            if (-not (Test-Path (Join-Path $installDir $entry.MainBinaryName))) {
              throw 'The installed application executable is missing.'
            }
          } finally {
            # _?= keeps NSIS in the original process, so -Wait covers the actual uninstall.
            $removed = Start-Process -FilePath (Join-Path $installDir 'uninstall.exe') -ArgumentList "/S _?=$installDir" -Wait -PassThru
            if ($removed.ExitCode -ne 0 -or (Test-Path $registryPath)) { throw 'Silent uninstall failed.' }
          }

      - name: Upload WinGet manifests
        uses: actions/upload-artifact@v4
        with:
          name: markra-winget-${{ steps.release.outputs.version }}
          path: generated/winget/
          if-no-files-found: error

      - name: Submit initial package or version update
        if: inputs.submit
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          INSTALLER_URL: ${{ steps.release.outputs.url }}
          MANIFEST_DIR: ${{ steps.release.outputs.manifest_dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            Write-Output '::warning::Set WINGET_CREATE_GITHUB_TOKEN to enable WinGet pull request submission. Validated manifests are available in the workflow artifacts.'
            exit 0
          }
          $headers = @{ Authorization = "Bearer $env:WINGET_CREATE_GITHUB_TOKEN"; Accept = 'application/vnd.github+json' }
          function Test-PackagePath([string] $path) {
            try {
              Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/winget-pkgs/contents/$path" -Headers $headers | Out-Null
              return $true
            } catch {
              if ($_.Exception.Response.StatusCode -eq [Net.HttpStatusCode]::NotFound) { return $false }
              throw
            }
          }
          $packagePath = 'manifests/m/Markra/Markra'
          $version = $env:RELEASE_VERSION
          if (Test-PackagePath "$packagePath/$version") {
            Write-Output "Markra.Markra $version is already in winget-pkgs."
            exit 0
          }
          $query = [Uri]::EscapeDataString("repo:microsoft/winget-pkgs is:pr is:open in:title Markra.Markra $version")
          $prs = Invoke-RestMethod -Uri "https://api.github.com/search/issues?q=$query" -Headers $headers
          $versionPattern = "(?<![\d.])$([regex]::Escape($version))(?![\d.])"
          if (@($prs.items | Where-Object { $_.title -match '(?<![\w.])Markra\.Markra(?![\w.])' -and $_.title -match $versionPattern }).Count -gt 0) {
            Write-Output "A WinGet pull request for Markra.Markra $version is already open."
            exit 0
          }

          Invoke-WebRequest -Uri 'https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe' -OutFile wingetcreate.exe
          if ((Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash -ne '24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA') {
            throw 'WinGetCreate checksum mismatch.'
          }
          if (Test-PackagePath $packagePath) {
            # Preserve metadata and installer settings reviewed in winget-pkgs after the first submission.
            .\wingetcreate.exe update Markra.Markra --version $version --urls "$env:INSTALLER_URL|x64|user" --release-notes-url "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG" --submit --no-open
          } else {
            .\wingetcreate.exe submit $env:MANIFEST_DIR --prtitle "New package: Markra.Markra version $version" --no-open
          }
          if ($LASTEXITCODE -ne 0) { throw "WinGetCreate failed: $LASTEXITCODE" }
